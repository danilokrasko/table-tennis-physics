  <h2>Spin lab</h2>
  <p>Same physics as the video: gravity, air drag and the Magnus force. One serve, same launch speed every time. Pick a spin and see where the ball goes. The dashed line is the same serve with no spin.</p>
  <div class="row"><select id="lk"><option value="side">Sidespin</option><option value="top">Topspin</option><option value="back">Backspin</option></select><input id="lr" type="range" min="0" max="5000" step="100" value="2600"><b id="lv"></b></div>

  <canvas id="lside" width="800" height="200"></canvas>
  <pre id="li"></pre>

{
